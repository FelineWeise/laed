services:
  # ── Reverse Proxy ──────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/admin-basicauth.caddy:/etc/caddy/admin-basicauth.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    # Separate file: bcrypt hash contains $ — must not live in compose .env (interpolation breaks it).
    env_file:
      - caddy.auth.env
    depends_on:
      - app
      - frontend
    networks:
      - frontend
      - backend
      - llm-backbone
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Web Frontend ───────────────────────────────────────────
  frontend:
    image: ${LAED_FRONTEND_IMAGE:-rg.fr-par.scw.cloud/laed/frontend:latest}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_DEMO_EMAIL: ${LAED_DEMO_EMAIL:-}
    networks:
      - frontend
    restart: always

  # ── Application Server ─────────────────────────────────
  app:
    image: ${LAED_BACKEND_IMAGE:-rg.fr-par.scw.cloud/laed/backend:latest}
    environment:
      - DATABASE_URL=postgresql+asyncpg://app:${DB_PASSWORD}@postgres:5432/projectspace
      - REDIS_URL=redis://redis:6379/0
      - LLM_GATEWAY_URL=${LLM_GATEWAY_URL}
      - LLM_GATEWAY_KEY=${LLM_GATEWAY_KEY}
      - RAG_DATABASE_URL=${RAG_DATABASE_URL:-}
      - LAED_TENANT_ID=${LAED_TENANT_ID:-}
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - LLM_MODEL=${LLM_MODEL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - LAED_DEMO_EMAIL=${LAED_DEMO_EMAIL:-}
      - LAED_DEMO_PASSWORD=${LAED_DEMO_PASSWORD:-}
      - LAED_DEMO_DISPLAY_NAME=${LAED_DEMO_DISPLAY_NAME:-Demo User}
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - frontend
      - backend
      - llm-backbone
    restart: always

  # ── Celery Worker ──────────────────────────────────────
  worker:
    image: ${LAED_BACKEND_IMAGE:-rg.fr-par.scw.cloud/laed/backend:latest}
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://app:${DB_PASSWORD}@postgres:5432/projectspace
      - REDIS_URL=redis://redis:6379/0
      - LLM_GATEWAY_URL=${LLM_GATEWAY_URL}
      - LLM_GATEWAY_KEY=${LLM_GATEWAY_KEY}
      - RAG_DATABASE_URL=${RAG_DATABASE_URL:-}
      - LAED_TENANT_ID=${LAED_TENANT_ID:-}
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - LLM_MODEL=${LLM_MODEL}
    depends_on:
      - redis
      - postgres
    networks:
      - backend
      - llm-backbone
    restart: always

  # ── Database (PostgreSQL + pgvector) ───────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=projectspace
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend
    restart: always

  # ── Task Queue Broker ──────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks:
      - backend
    restart: always

  # ── File Storage ───────────────────────────────────────
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - filedata:/data
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - backend
    restart: always

  # ── Speech-to-Text ─────────────────────────────────────
  # Parakeet STT now lives in the llm-gateway stack (single model front door).
  # laed reaches it via the gateway as model `stt/parakeet` (see app.services.stt).

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  filedata:

networks:
  frontend:
  backend:
  llm-backbone:
    external: true
