# LEGACY — LAED no longer runs an in-repo LiteLLM service. Canonical proxy config lives in
# the sibling repository `llm-gateway/litellm-config.yaml`. This file is kept only for
# historical reference and local experiments; do not treat it as the source of truth.

# LAED LiteLLM proxy with strict raw model names and centralized fallback routing.
#
# Env (docker-compose):
#   OLLAMA_URL              — Ollama base URL (no /v1), e.g. http://172.16.20.2:11434 (GPU on laed-private)
#   THIRDPARTY_LITELLM_URL  — Third-party OpenAI-compatible LiteLLM URL (with /v1)
#   THIRDPARTY_LITELLM_KEY  — API key for that third-party gateway
#   LITELLM_MASTER_KEY      — key all clients use against this gateway

model_list:
  # Local models (primary)
  - model_name: ollama/qwen2.5:14b-instruct-q4_K_M
    litellm_params:
      model: ollama/qwen2.5:14b-instruct-q4_K_M
      api_base: os.environ/OLLAMA_URL
      timeout: 600
      stream_timeout: 180

  - model_name: ollama/qwen2.5:7b-instruct-q4_K_M
    litellm_params:
      model: ollama/qwen2.5:7b-instruct-q4_K_M
      api_base: os.environ/OLLAMA_URL
      timeout: 600
      stream_timeout: 180

  - model_name: ollama/nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_URL
      timeout: 120

  # Third-party models (fallback candidates)
  - model_name: openai/claude-opus-4-7
    litellm_params:
      model: openai/claude-opus-4-7
      api_base: os.environ/THIRDPARTY_LITELLM_URL
      api_key: os.environ/THIRDPARTY_LITELLM_KEY
      timeout: 600
      stream_timeout: 180

  - model_name: openai/claude-sonnet-4-6
    litellm_params:
      model: openai/claude-sonnet-4-6
      api_base: os.environ/THIRDPARTY_LITELLM_URL
      api_key: os.environ/THIRDPARTY_LITELLM_KEY
      timeout: 600
      stream_timeout: 180

  - model_name: openai/gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_base: os.environ/THIRDPARTY_LITELLM_URL
      api_key: os.environ/THIRDPARTY_LITELLM_KEY
      timeout: 600
      stream_timeout: 180

  - model_name: openai/gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_base: os.environ/THIRDPARTY_LITELLM_URL
      api_key: os.environ/THIRDPARTY_LITELLM_KEY
      timeout: 600
      stream_timeout: 180

litellm_settings:
  num_retries: 2
  request_timeout: 600
  # Ordered fallback chain, keyed by raw primary model names.
  fallbacks:
    - ollama/qwen2.5:14b-instruct-q4_K_M: [openai/claude-opus-4-7, openai/claude-sonnet-4-6, openai/gpt-4o, openai/gpt-5-mini]
    - ollama/qwen2.5:7b-instruct-q4_K_M: [openai/gpt-5-mini, openai/gpt-4o, openai/claude-sonnet-4-6]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # LiteLLM proxy_cli copies this into os.environ["DATABASE_URL"] for Prisma — must be postgresql:// (not +asyncpg).
  database_url: os.environ/DATABASE_URL
